<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHH-Insight</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid #1e2130;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }
    header h1 { font-size: 1rem; font-weight: 600; color: #fff; }
    #subtitle { font-size: 0.78rem; color: #555; }

    #config-chips {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }
    .config-chip {
      background: #13161f;
      border: 1px solid #1e2130;
      border-radius: 6px;
      color: #556;
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
    }

    /* ── Setup ─────────────────────────────────── */

    #setup-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .setup-card {
      background: #13161f;
      border: 1px solid #1e2130;
      border-radius: 14px;
      padding: 2rem 2.2rem 1.8rem;
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    .setup-card h2 {
      font-size: 0.95rem;
      font-weight: 500;
      color: #888;
      margin-bottom: -0.8rem;
    }

    .field-group { display: flex; flex-direction: column; gap: 0.75rem; }

    .field-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .radio-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }

    .radio-row input[type="radio"] { display: none; }

    .radio-row .chip {
      border: 1px solid #2a2d3a;
      border-radius: 7px;
      color: #888;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.45rem 0.85rem;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      user-select: none;
    }

    .radio-row input[type="radio"]:checked + .chip {
      background: #1a4a8a;
      border-color: #2a6ab0;
      color: #ddeeff;
    }

    .radio-row .chip:hover { border-color: #4a9eff; color: #ccc; }

    #start-btn {
      align-self: flex-end;
      background: #1a4a8a;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 1.6rem;
      transition: background 0.15s;
    }
    #start-btn:hover { background: #2060aa; }

    /* ── Loading ────────────────────────────────── */

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      color: #555;
      font-size: 0.85rem;
    }
    .loading-state .spinner {
      width: 28px; height: 28px;
      border: 2px solid #2a2d3a;
      border-top-color: #4a9eff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Chat ───────────────────────────────────── */

    #chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .msg { max-width: 75%; line-height: 1.55; font-size: 0.88rem; }

    .msg.system {
      color: #444;
      font-size: 0.78rem;
      align-self: center;
    }

    .msg.user {
      align-self: flex-end;
      background: #1a4a8a;
      border-radius: 12px 12px 2px 12px;
      color: #ddeeff;
      padding: 0.6rem 0.9rem;
    }

    .msg.bot {
      align-self: flex-start;
      background: #13161f;
      border: 1px solid #1e2130;
      border-radius: 2px 12px 12px 12px;
      color: #e0e0e0;
      padding: 0.7rem 1rem;
      white-space: pre-wrap;
    }

    .msg.bot .sources {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px solid #1e2130;
      font-size: 0.75rem;
      color: #556;
    }

    .msg.bot .sources span {
      display: inline-block;
      background: #0f1117;
      border: 1px solid #1e2130;
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      margin: 0.15rem 0.15rem 0 0;
    }

    .msg.thinking {
      align-self: flex-start;
      background: #13161f;
      border: 1px solid #1e2130;
      border-radius: 2px 12px 12px 12px;
      padding: 0.7rem 1rem;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .msg.thinking span {
      width: 7px; height: 7px;
      background: #3a4060;
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .msg.thinking span:nth-child(2) { animation-delay: 0.2s; }
    .msg.thinking span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); background: #4a9eff; }
    }

    #input-area {
      border-top: 1px solid #1e2130;
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
    }

    #question-input {
      background: #13161f;
      border: 1px solid #1e2130;
      border-radius: 8px;
      color: #e0e0e0;
      flex: 1;
      font-size: 0.88rem;
      outline: none;
      padding: 0.6rem 0.9rem;
      transition: border-color 0.15s;
    }
    #question-input:focus { border-color: #4a9eff; }
    #question-input:disabled { opacity: 0.35; }

    #send-btn {
      background: #1a4a8a;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.55rem 1rem;
      transition: background 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: #2060aa; }
    #send-btn:disabled { opacity: 0.3; cursor: default; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <div style="display:flex;align-items:baseline;gap:0.8rem">
    <h1>🎓 BHH-Insight</h1>
    <span id="subtitle">Verbinde…</span>
  </div>
  <div id="config-chips"></div>
</header>

<div id="setup-view">
  <div class="loading-state">
    <div class="spinner"></div>
    <span>Verbinde mit Server…</span>
  </div>
</div>

<div id="chat-view" class="hidden">
  <div id="messages"></div>
  <div id="input-area">
    <input id="question-input" type="text" placeholder="Deine Frage…" disabled>
    <button id="send-btn" disabled>&#x27A4;</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const setupView = document.getElementById('setup-view');
  const chatView = document.getElementById('chat-view');
  const subtitle = document.getElementById('subtitle');
  const configChips = document.getElementById('config-chips');
  const messages = document.getElementById('messages');
  const input = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');

  let selectedLabels = { family: '', studiengang: '', jahrgang: '' };
  let streamingBubble = null; // the current bot bubble being streamed into

  // ── Setup form ────────────────────────────────

  socket.on('setup_form', ({ familyLabels, studiengangLabels, jahrgangLabels, defaults }) => {
    subtitle.textContent = 'Setup';

    setupView.innerHTML = `
      <form class="setup-card" id="setup-form">
        <h2>Willkommen bei BHH-Insight</h2>

        <div class="field-group">
          <label>Modellanbieter</label>
          <div class="radio-row">
            ${familyLabels.map((l, i) => `
              <input type="radio" name="family" id="f${i}" value="${i}" ${i === defaults.familyIdx ? 'checked' : ''}>
              <label class="chip" for="f${i}">${l}</label>
            `).join('')}
          </div>
        </div>

        <div class="field-group">
          <label>Studiengang</label>
          <div class="radio-row">
            ${studiengangLabels.map((l, i) => `
              <input type="radio" name="studiengang" id="sg${i}" value="${i}" ${i === defaults.studiengangIdx ? 'checked' : ''}>
              <label class="chip" for="sg${i}">${l}</label>
            `).join('')}
          </div>
        </div>

        <div class="field-group">
          <label>Jahrgang</label>
          <div class="radio-row">
            ${jahrgangLabels.map((l, i) => `
              <input type="radio" name="jahrgang" id="jg${i}" value="${i}" ${i === defaults.jahrgangIdx ? 'checked' : ''}>
              <label class="chip" for="jg${i}">${l}</label>
            `).join('')}
          </div>
        </div>

        <button type="submit" id="start-btn">Starten</button>
      </form>`;

    document.getElementById('setup-form').addEventListener('submit', e => {
      e.preventDefault();
      const result = {
        familyIdx: parseInt(document.querySelector('input[name="family"]:checked').value),
        studiengangIdx: parseInt(document.querySelector('input[name="studiengang"]:checked').value),
        jahrgangIdx: parseInt(document.querySelector('input[name="jahrgang"]:checked').value),
      };
      selectedLabels = {
        family: familyLabels[result.familyIdx],
        studiengang: studiengangLabels[result.studiengangIdx],
        jahrgang: jahrgangLabels[result.jahrgangIdx],
      };
      socket.emit('setup_submit', result);
      setupView.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <span id="loading-status">Lade Dokumente…</span>
        </div>`;
    });
  });

  // ── Display messages (loading status & chat) ──

  socket.on('display', ({ message }) => {
    const loadingStatus = document.getElementById('loading-status');
    if (loadingStatus) {
      loadingStatus.textContent = message;
      return;
    }
    if (!message.includes('Denke nach')) addMsg('system', message);
  });

  // ── Streaming answer ──────────────────────────

  socket.on('answer_start', () => {
    removeThinking();
    streamingBubble = document.createElement('div');
    streamingBubble.className = 'msg bot';
    streamingBubble.dataset.text = '';
    messages.appendChild(streamingBubble);
    messages.scrollTop = messages.scrollHeight;
  });

  socket.on('answer_token', ({ token }) => {
    if (!streamingBubble) return;
    streamingBubble.dataset.text += token;
    streamingBubble.textContent = streamingBubble.dataset.text;
    messages.scrollTop = messages.scrollHeight;
  });

  socket.on('answer_end', ({ sources }) => {
    if (streamingBubble && sources && sources.length > 0) {
      const sourcesEl = document.createElement('div');
      sourcesEl.className = 'sources';
      sourcesEl.innerHTML = '📄 ' + sources.map(s => `<span>${s}</span>`).join('');
      streamingBubble.appendChild(sourcesEl);
    }
    streamingBubble = null;
    setInputEnabled(true);
    messages.scrollTop = messages.scrollHeight;
  });

  // ── Chat ──────────────────────────────────────

  socket.on('ask_text', ({ prompt }) => {
    if (!chatView.classList.contains('hidden')) {
      setInputEnabled(true);
      return;
    }
    setupView.classList.add('hidden');
    chatView.classList.remove('hidden');
    input.placeholder = prompt;
    setInputEnabled(true);

    subtitle.textContent = '';
    configChips.innerHTML = [
      selectedLabels.family,
      selectedLabels.studiengang,
      `JG ${selectedLabels.jahrgang}`,
    ].map(l => `<span class="config-chip">${l}</span>`).join('');
  });

  function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    setInputEnabled(false);
    addMsg('user', text);
    addThinking();
    socket.emit('response', text);
  }

  function addThinking() {
    const div = document.createElement('div');
    div.className = 'msg thinking';
    div.innerHTML = '<span></span><span></span><span></span>';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  // ── Helpers ───────────────────────────────────

  function addMsg(type, text) {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeThinking() {
    messages.querySelectorAll('.msg.thinking').forEach(el => el.remove());
  }

  function setInputEnabled(on) {
    input.disabled = !on;
    sendBtn.disabled = !on;
    if (on) input.focus();
  }

  socket.on('connect', () => { subtitle.textContent = 'Setup'; });
  socket.on('disconnect', () => { subtitle.textContent = 'Verbindung getrennt'; });
</script>
</body>
</html>
